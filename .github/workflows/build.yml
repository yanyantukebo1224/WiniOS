name: Build WiniOS IPA

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || \
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install Build Tools
        run: |
          brew install ninja cmake
          python3 -m pip install --break-system-packages packaging || pip3 install packaging || true

      - name: Build FEXCore for iOS
        run: |
          python3 -c '
          import shutil
          with open("FEX/CMakeLists.txt", "r") as f:
              s = f.read()
          s = s.replace("string(TOLOWER ${CMAKE_SYSTEM_PROCESSOR} processor)", "set(CMAKE_SYSTEM_PROCESSOR \"arm64\")\nstring(TOLOWER \"${CMAKE_SYSTEM_PROCESSOR}\" processor)")
          with open("FEX/CMakeLists.txt", "w") as f:
              f.write(s)

          shutil.copyfile("app/Madeira/AtomicRefPolyfill.h", "FEX/FEXCore/include/FEXCore/Utils/AtomicRefPolyfill.h")
          for p in ["FEX/FEXCore/include/FEXCore/Utils/SpinWaitLock.h", "FEX/FEXCore/include/FEXCore/Utils/WritePriorityMutex.h", "FEX/FEXCore/include/FEXCore/Utils/SHMStats.h"]:
              with open(p, "r") as f:
                  c = f.read()
              if "AtomicRefPolyfill.h" not in c:
                  c = "#include <FEXCore/Utils/AtomicRefPolyfill.h>\n" + c
                  with open(p, "w") as f:
                      f.write(c)

          core_cpp = "FEX/FEXCore/Source/Interface/Core/Core.cpp"
          with open(core_cpp, "r") as f:
              cc = f.read()
          old_block = "  /* iOS-Madeira ml316: report ExitToX64 FFS bypasses"
          if old_block in cc and "#ifdef FEX_IOS_HOST\n  /* iOS-Madeira ml316" not in cc:
              cc = cc.replace(old_block, "#ifdef FEX_IOS_HOST\n" + old_block)
              close_block = "IosCbEntryLog[4], IosCbEntryLog[5], IosCbEntryLog[7]);\n    }\n  }"
              cc = cc.replace(close_block, close_block + "\n#endif")
              with open(core_cpp, "w") as f:
                  f.write(cc)
          '
          mkdir -p FEX/build-ios
          cd FEX/build-ios
          cmake -GNinja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DTUNE_CPU=none \
            -DTUNE_ARCH=generic \
            -DBUILD_TESTING=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_ASSERTIONS=OFF \
            ..
          ninja -j$(sysctl -n hw.ncpu) FEXCore FEXCore_Base fmt cephes_128bit xxhash softfloat_3e || ninja -j$(sysctl -n hw.ncpu) FEXCore || true
          cd ../..

      - name: Fetch and Prepare VC++ Runtime
        run: |
          mkdir -p app/Madeira/x86_64-vcruntime
          curl -L -s -o /tmp/vc_redist.x64.exe https://aka.ms/vs/17/release/vc_redist.x64.exe || true
          brew install sevenzip || true
          7zz x /tmp/vc_redist.x64.exe -o/tmp/vcredist || true
          find /tmp/vcredist -name "*.cab" -exec 7zz x {} -oapp/Madeira/x86_64-vcruntime/ \; || true
          touch app/Madeira/x86_64-vcruntime/.keep

      - name: Build Unix Libraries (if build scripts present)
        run: |
          chmod +x build/*/build.sh || true
          mkdir -p app/Madeira
          if [ -f "app/libdxmt_unix.a" ] && [ ! -f "app/Madeira/libdxmt_combined.a" ]; then
            cp app/libdxmt_unix.a app/Madeira/libdxmt_combined.a
          fi
          # Run individual component builds if their base libs need assembly
          if [ -f "build/wineserver/build.sh" ]; then
            bash build/wineserver/build.sh all || true
          fi
          if [ -f "build/ntdll-unix/build.sh" ]; then
            bash build/ntdll-unix/build.sh || true
          fi
          if [ -f "build/win32u-unix/build.sh" ]; then
            bash build/win32u-unix/build.sh || true
          fi

      - name: Build Madeira Xcode App
        run: |
          xcodebuild -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CLANG_CXX_LANGUAGE_STANDARD="c++20" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "Madeira.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Madeira.app not found!"
            exit 1
          fi
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r -9 WiniOS.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiniOS-GameHub-IPA
          path: build/WiniOS.ipa
          retention-days: 14
